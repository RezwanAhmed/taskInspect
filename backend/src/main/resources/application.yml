spring:
  application:
    name: taskinspect-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Local development: read a .env file (repository root or backend/)
    # if it exists. Real environment variables always win.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    # Adds the request ID (see RequestIdFilter) to every log line
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
