# Test-only settings (added on top of src/main/resources/application.yml).
# storage.type and push.type are pinned regardless of a developer's real
# .env - that file's STORAGE_TYPE=s3 / PUSH_TYPE=fcm (task 8.1/8.4) would
# otherwise leak into tests too (spring.config.import applies to any
# Spring Boot context, test or not) and point them at real Cloudflare R2 /
# Firebase instead of the local/log test doubles they are written against.
taskinspect.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
taskinspect.storage.type=local
taskinspect.storage.local.directory=build/test-evidence
taskinspect.push.type=log
