# Backend: build and run every test (unit, PostgreSQL integration via
# Testcontainers, security) on each push and pull request that touches
# the backend (task 10.1).
name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Compiles, runs all tests (Docker is available on the runner for
      # Testcontainers), runs SpotBugs on the application code and builds
      # the jar.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test and SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/spotbugs
          retention-days: 7

  # Builds the Docker image and checks that it starts and connects to
  # PostgreSQL (task 8.8). Pushing the image to a registry is task 10.4.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskinspect
          POSTGRES_USER: taskinspect
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskinspect -d taskinspect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t taskinspect-backend:ci backend

      - name: Start the image and wait until it is healthy
        run: |
          docker run -d --name backend --network host \
            -e DB_HOST=localhost -e DB_PASSWORD=ci-only-password \
            -e JWT_SECRET=ci-only-jwt-secret-with-at-least-32-characters \
            taskinspect-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f backend || true
