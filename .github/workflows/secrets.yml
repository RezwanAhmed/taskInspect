# Secret scanning (task 10.5c): fails when a password, token or key is
# committed. Scans the whole git history with gitleaks' default rules, so
# a secret that was added and removed again is still found.
name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The official gitleaks image v8.30.1, pinned by digest (supply-chain
      # safety); --redact keeps found secrets out of the log. It runs as
      # the runner's user so it creates no root-owned files.
      - name: Scan the git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo
