# Mobile app: static analysis and every unit / widget test on each push
# and pull request that touches the Flutter app (task 10.3). Integration
# tests (integration_test/) need a device and a backend, so they are not
# run here.
name: Mobile

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # The same Flutter version as on the development laptop.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # The database tests open an in-memory SQLite database through
      # drift's native bindings, which load libsqlite3.so.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Builds a signed release AAB and uploads it as a workflow artifact
  # (task 10.7). Only on a version tag (vX.Y.Z), and only once the
  # signing secrets exist - skips cleanly otherwise. Creating the
  # release keystore itself is task 11.1 (app signing), not done here
  # on purpose: it is a one-time, high-stakes artifact (losing it means
  # never being able to update the Play Store listing again) that
  # deserves a deliberate decision, not something generated quietly in
  # a workflow. Needs these repository secrets once 11.1 happens:
  #   ANDROID_KEYSTORE_BASE64 - the .jks/.keystore file, base64-encoded
  #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  release:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set
        id: check
        run: echo "has-keystore=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has-keystore == 'true'
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Decode the keystore
        if: steps.check.outputs.has-keystore == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        if: steps.check.outputs.has-keystore == 'true'
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install packages
        if: steps.check.outputs.has-keystore == 'true'
        run: flutter pub get

      - name: Build release AAB
        if: steps.check.outputs.has-keystore == 'true'
        run: flutter build appbundle --release --dart-define=APP_ENV=prod

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.has-keystore == 'true'
        with:
          name: release-aab-${{ github.ref_name }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
