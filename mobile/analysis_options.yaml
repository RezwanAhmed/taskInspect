# Static analysis for the TaskInspect app. Run with `flutter analyze`.
#
# Starts from the official Flutter lints and adds stricter checks, so that
# mistakes (implicit dynamic, unawaited futures, unclosed streams, stray
# prints) are caught before review.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    # Style and readability
    - always_declare_return_types
    - always_use_package_imports
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - sort_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
